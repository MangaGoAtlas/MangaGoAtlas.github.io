<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaGoAtlas Chapters Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#eee;font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:20px 16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav a{color:#b9c0ce;text-decoration:none;padding:9px 12px;border:1px solid #292e39;border-radius:8px}.panel{background:#11131a;border:1px solid #292e39;border-radius:12px;padding:16px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#aab0bd;font-size:13px;margin:9px 0 5px}button,input,select{padding:9px;border-radius:8px;border:1px solid #343a48;background:#090b10;color:#fff;font:inherit}button{background:#3f73c9;font-weight:700;cursor:pointer}.danger{background:#a73535}.secondary{background:#292e39}.hidden{display:none}.item{padding:12px;border:1px solid #292e39;border-radius:9px;margin:7px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.muted{color:#aab0bd}.status{background:#171b23;padding:10px;border-radius:8px;margin-top:10px;white-space:pre-wrap}@media(max-width:700px){.row{grid-template-columns:1fr}.item{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="nav"><a href="/admin/">⚙️ Dashboard</a><a href="manga.html">📖 Manga</a><a href="ads.html">📢 Ads</a><a href="/">Open site</a></div><h1>📚 Chapters Admin</h1><div id="login" class="panel"><input id="token" type="password" placeholder="GitHub token" style="width:70%"> <button id="connect">Connect</button><div id="msg" class="status"></div></div><main id="app" class="hidden"><div class="panel"><label>Manga</label><select id="manga" style="width:100%"></select><div class="actions" style="margin-top:10px"><button id="add">＋ Add chapter</button><button id="logout" class="secondary">Forget token</button></div></div><div id="list" class="panel"></div><div id="editor" class="panel hidden"><h2 id="heading">Add chapter</h2><div class="row"><div><label>Chapter number</label><input id="number" type="number"></div><div><label>Title</label><input id="title" style="width:100%"></div><div><label>Slug</label><input id="slug" style="width:100%"></div><div><label>Chapter images</label><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/gif"></div></div><div class="actions" style="margin-top:12px"><button id="save">Save chapter</button><button id="upload" class="secondary">Upload images</button><button id="delete" class="danger hidden">Delete</button><button id="cancel" class="secondary">Cancel</button></div><div id="status" class="status"></div></div></main></div><script>'use strict';const KEY='mangogoatlas_github_token',O='MangaGoAtlas',R='MangaGoAtlas.github.io',B='main',PATH='data/content.json',MANUAL='data/manual-chapters.json';let token=sessionStorage.getItem(KEY)||'',data={mangas:[],chapters:[]},manual={version:1,chapters:[]},editing=null,editingManual=false;const $=id=>document.getElementById(id);function enc(s){const u=new TextEncoder().encode(s);let x='';for(let i=0;i<u.length;i+=32768)x+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(x)}function dec(s){const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={}){const r=await fetch('https://api.github.com/repos/'+O+'/'+R+path,{...opt,headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json',...(opt.headers||{})},cache:'no-store'});const text=await r.text();let x={};try{x=text?JSON.parse(text):{}}catch{}if(!r.ok)throw Error('GitHub '+r.status+': '+(x.message||text.slice(0,300)));return x}async function readFile(path){const x=await api('/contents/'+path+'?ref='+B);return{x,data:JSON.parse(dec(x.content))}}async function writeFile(path,data,sha,message){const x=await api('/contents/'+path,{method:'PUT',body:JSON.stringify({message,content:enc(JSON.stringify(data,null,2)+'\n'),sha,branch:B})});return x.content.sha}async function load(){let x=await readFile(PATH);data=x.data;data.mangas=data.mangas||[];data.chapters=data.chapters||[];try{x=await readFile(MANUAL);manual=x.data;manual.chapters=manual.chapters||[]}catch{manual={version:1,chapters:[]}}renderMangas();renderList()}function selected(){return $('manga').value}function matches(c,id){const mid=c.mangaId||c.manga_id||c.seriesId||c.series_id;if(mid===id)return true;const m=data.mangas.find(x=>x.id===id);return !!m&&String(c.slug||'').toLowerCase().startsWith(String(m.slug||m.id||'').toLowerCase()+'-')}function all(){const id=selected(),a=data.chapters.filter(c=>matches(c,id)).map(c=>({...c,_manual:false}));for(const c of manual.chapters||[])if(matches(c,id)&&!a.some(x=>x.slug===c.slug))a.push({...c,_manual:true});return a.sort((a,b)=>(Number(b.number)||0)-(Number(a.number)||0))}function renderMangas(){const old=selected();$('manga').innerHTML=data.mangas.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.title)+'</option>').join('');if(data.mangas.some(m=>m.id===old))$('manga').value=old}function renderList(){const a=all();$('list').innerHTML='<h2>'+a.length+' chapters</h2>'+a.map(c=>'<div class="item"><div><b>'+esc(c.title||('Chapter '+c.number))+'</b><br><span class="muted">Chapter '+esc(c.number)+' · '+esc(c.slug)+' · '+(Array.isArray(c.pages)?c.pages.length:0)+' pages</span></div><div class="actions"><button class="secondary" onclick="editChapter(\''+encodeURIComponent(c.slug)+'\','+(c._manual?'true':'false')+')">Edit</button><button class="danger" onclick="deleteChapter(\''+encodeURIComponent(c.slug)+'\','+(c._manual?'true':'false')+')">Delete</button></div></div>').join('')||'<p class="muted">No chapters for this manga.</p>'}function reset(){editing=null;editingManual=false;$('heading').textContent='Add chapter';$('number').value='';$('title').value='';$('slug').value='';$('files').value='';$('delete').classList.add('hidden');$('editor').classList.add('hidden');$('status').textContent=''}$('manga').onchange=renderList;$('add').onclick=()=>{const m=data.mangas.find(x=>x.id===selected());if(!m){$('msg').textContent='Add a manga first.';return}editing=null;editingManual=true;$('heading').textContent='Add chapter';$('number').value='';$('title').value='';$('slug').value=(m.slug||m.id)+'-raw-';$('files').value='';$('delete').classList.add('hidden');$('editor').classList.remove('hidden')};window.editChapter=(key,isManual)=>{const slug=decodeURIComponent(key),c=isManual?manual.chapters.find(x=>x.slug===slug):data.chapters.find(x=>x.slug===slug);if(!c)return;editing={...c};editingManual=isManual;$('heading').textContent='Edit chapter';$('number').value=c.number||'';$('title').value=c.title||'';$('slug').value=c.slug||'';$('files').value='';$('delete').classList.remove('hidden');$('editor').classList.remove('hidden')};$('cancel').onclick=reset;$('logout').onclick=()=>{sessionStorage.removeItem(KEY);location.reload()};$('connect').onclick=async()=>{const t=$('token').value.trim();if(!t)return;token=t;$('msg').textContent='Connecting to MangaGoAtlas/MangaGoAtlas.github.io…';try{await api('/contents/'+PATH+'?ref='+B);sessionStorage.setItem(KEY,token);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load();$('msg').textContent='✓ Connected.'}catch(e){$('msg').textContent='Connection failed: '+e.message}};$('save').onclick=async()=>{try{const m=data.mangas.find(x=>x.id===selected()),number=Number($('number').value),title=$('title').value.trim(),slug=$('slug').value.trim();if(!m)throw Error('Select a manga.');if(!number||!title||!slug)throw Error('Chapter number, title and slug are required.');const now=new Date().toISOString();if(editing){const path=editingManual?MANUAL:PATH,x=await readFile(path),c=x.data.chapters.find(z=>z.id===editing.id||z.slug===editing.slug);if(!c)throw Error('Chapter not found.');Object.assign(c,{mangaId:m.id,number,title,slug,updatedAt:now});if(!editingManual)c.updated_at=now;await writeFile(path,x.data,x.x.sha,'Update chapter '+slug)}else{const x=await readFile(MANUAL);x.data.chapters=x.data.chapters||[];if([...data.chapters,...manual.chapters].some(c=>c.slug===slug))throw Error('Slug already exists.');x.data.chapters.push({id:'manual-'+Date.now(),mangaId:m.id,number,title,slug,country:'JP',pages:[],createdAt:now,updatedAt:now});await writeFile(MANUAL,x.data,x.x.sha,'Add chapter '+slug)}await load();editing=manual.chapters.find(c=>c.slug===slug)||data.chapters.find(c=>c.slug===slug);editingManual=!!manual.chapters.find(c=>c.slug===slug);$('status').textContent='✓ Chapter saved.';renderList()}catch(e){$('status').textContent='Error: '+e.message}};window.deleteChapter=async(key,isManual)=>{if(!confirm('Delete this chapter record?'))return;const slug=decodeURIComponent(key);try{const path=isManual?MANUAL:PATH,x=await readFile(path);x.data.chapters=(x.data.chapters||[]).filter(c=>c.slug!==slug);await writeFile(path,x.data,x.x.sha,'Delete chapter '+slug);reset();await load();$('msg').textContent='✓ Chapter deleted.'}catch(e){$('msg').textContent='Delete failed: '+e.message}};$('upload').onclick=async()=>{try{if(!editing)throw Error('Save the chapter first.');const fs=[...$('files').files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));if(!fs.length)throw Error('Select images first.');const m=data.mangas.find(x=>x.id===selected()),folder='chapter-images/'+(m.slug||m.id)+'/chapter-'+editing.slug,pages=[];for(let i=0;i<fs.length;i++){const f=fs[i];if(f.size>24*1024*1024)throw Error(f.name+' is larger than 24 MB.');const path=folder+'/'+String(i+1).padStart(4,'0')+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const body={message:'Upload chapter image '+editing.slug,content:await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)}),branch:B};const old=await api('/contents/'+path+'?ref='+B).catch(()=>null);if(old?.sha)body.sha=old.sha;const r=await api('/contents/'+path,{method:'PUT',body:JSON.stringify(body)});pages.push(r.content.download_url||'https://raw.githubusercontent.com/'+O+'/'+R+'/'+B+'/'+path);$('status').textContent='Uploaded '+(i+1)+'/'+fs.length+'…'}const path=editingManual?MANUAL:PATH,x=await readFile(path),c=x.data.chapters.find(z=>z.id===editing.id||z.slug===editing.slug);if(!c)throw Error('Chapter not found.');c.pages=pages;c.updatedAt=new Date().toISOString();if(!editingManual)c.updated_at=c.updatedAt;await writeFile(path,x.data,x.x.sha,'Update chapter images '+editing.slug);await load();editing=manual.chapters.find(z=>z.id===c.id)||data.chapters.find(z=>z.id===c.id);editingManual=!!manual.chapters.find(z=>z.id===c.id);$('status').textContent='✓ Images uploaded.'}catch(e){$('status').textContent='Upload failed: '+e.message}};$('delete').onclick=()=>editing&&deleteChapter(encodeURIComponent(editing.slug),editingManual);async function boot(){if(!token)return;try{await load();$('login').classList.add('hidden');$('app').classList.remove('hidden')}catch(e){$('msg').textContent='Saved token cannot access MangaGoAtlas. Please reconnect.'}}boot();</script></body></html>
